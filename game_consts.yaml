# Time config for games

# ===== GAMES SCHEDULE =====
# The scheduler cron (.github/workflows/scheduler.yml) is set for these days
# (signup Sunday morning, game Wednesday evening) - update it if they change.
game:
  day: 2  # day of the week (0=monday, 1=tuesday, ..., 6=sunday)
  hour: 18
  minute: 30
  # Start-time changes from a given date on (Warsaw wall-clock time; the
  # summer/winter time switch is handled in code). The last entry whose
  # `from` date is on or before the game date wins over hour/minute above.
  time_changes:
    - from: 2026-11-01  # winter season
      hour: 19
      minute: 30

# ===== SIGNUP OPENING =====
signup:
  day: 6  # sunday
  hour: 10
  minute: 0

# ===== GUESTS =====
# Signed-in users can add this many guests (friends without an account).
guests:
  max_per_user: 5

# ===== TEAMS CONFIGURATION =====
# Lineups per player count, used by the squad builder: team colours, target
# team sizes when filling at random, and the team counts it offers (2 or 3).
# Per team count, the smallest player count is the minimum that format needs
# (3 teams: 18) and the largest is its limit - with more players signed up,
# the latest signups wait on the reserve bench. The builder defaults to the
# most teams there are enough players for (15-17 players: 2 teams + bench).
teams:
  12:
    count: 2
    colors: ["czerwona", "czarna"]
    players_per_team: [6, 6]

  14:
    count: 2
    colors: ["czerwona", "czarna"]
    players_per_team: [7, 7]

  18:
    count: 3
    colors: ["biała", "czerwona", "czarna"]
    players_per_team: [6, 6, 6]

# DAY NAMES (nominative + accusative, e.g. "w środę")
day_names: ["poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota", "niedziela"]
day_names_accusative: ["poniedziałek", "wtorek", "środę", "czwartek", "piątek", "sobotę", "niedzielę"]
