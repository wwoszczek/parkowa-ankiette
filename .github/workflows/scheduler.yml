name: Game scheduler

on:
  schedule:
    # Times are UTC and tied to game_consts.yaml (signup Sunday 10:00, game
    # Wednesday evening, Warsaw time) - update them if those days change.
    # Every run does all steps (deactivate, create, activate), so each run
    # also covers for a delayed or dropped one.
    # Sunday signup opening: 08:00 UTC = 10:00 CEST, 09:00 UTC = 10:00 CET;
    # 11:30 UTC is a safety net if both were dropped.
    - cron: '0 8,9 * * 0'
    - cron: '30 11 * * 0'
    # Wednesday after kickoff (22:00 CEST / 21:00 CET): deactivate the game
    # and pre-create next week's one.
    - cron: '0 20 * * 3'

  workflow_dispatch:

env:
  SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Only the scheduler's deps (no Streamlit)
        pip install psycopg2-binary PyYAML pytz

    - name: Run scheduler
      run: |
        echo "Running games scheduler..."
        python github_scheduler.py

    - name: Upload logs as artifacts (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scheduler-logs
        path: /tmp/scheduler.log
        retention-days: 7

    - name: Notify on failure (optional)
      if: failure()
      run: |
        echo "Scheduler failed at $(date)"
        # Here you can add notifications to Slack/Discord/email
