name: Game scheduler

on:
  schedule:
    # Times are UTC and tied to game_consts.yaml (signup Friday 06:00, game
    # Monday 19:00-20:30, Warsaw time) - update them if those days change.
    # Every run does all steps (deactivate, clean up, create, activate), so
    # each run also covers for a delayed or dropped one.
    # Friday signup opening: 04:00 UTC = 06:00 CEST, 05:00 UTC = 06:00 CET;
    # 07:30 UTC is a safety net if both were dropped.
    - cron: '0 4,5 * * 5'
    - cron: '30 7 * * 5'
    # Monday after the game (22:00 CEST / 21:00 CET): deactivate it and
    # pre-create next week's one.
    - cron: '0 20 * * 1'

  workflow_dispatch:

env:
  SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Only the scheduler's deps (no Streamlit)
        pip install psycopg2-binary PyYAML pytz

    - name: Run scheduler
      run: |
        echo "Running games scheduler..."
        python github_scheduler.py

    - name: Upload logs as artifacts (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scheduler-logs
        path: /tmp/scheduler.log
        retention-days: 7

    - name: Notify on failure (optional)
      if: failure()
      run: |
        echo "Scheduler failed at $(date)"
        # Here you can add notifications to Slack/Discord/email
